name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag and release name (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build app
        run: cargo build-app
      - name: Package app
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/VercelBar.app "VercelBar-${RELEASE_TAG}.app.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: gh release create "$RELEASE_TAG" "VercelBar-${RELEASE_TAG}.app.zip" --title "$RELEASE_TAG" --generate-notes
