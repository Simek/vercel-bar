[package]
name = "vercel-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dotenvy = "0.15"
once_cell = "1.21"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26.1"
keyring = "4.2.0"
objc = "0.2"
